name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Test both modules with bundled fixtures
        run: swift test
      - name: Build macOS example
        run: >-
          xcodebuild -project TMarkExampleApp/TMarkExampleApp.xcodeproj
          -scheme TMarkExampleMac -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath .build/xcode-macos
          CODE_SIGNING_ALLOWED=NO build
      - name: Build iOS example
        run: >-
          xcodebuild -project TMarkExampleApp/TMarkExampleApp.xcodeproj
          -scheme TMarkExampleiOS -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/xcode-ios
          CODE_SIGNING_ALLOWED=NO build
